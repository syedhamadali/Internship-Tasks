<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamad Ali Shah - Profile Card</title>
  <style>
    :root {
      --bg-body: #eef2f6;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.15);
      --radius: 20px;
      --font-heading: 'Georgia', 'Times New Roman', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-body);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card-wrapper {
      width: 100%;
      max-width: 500px;
      min-width: 350px;
    }

    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .profile-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px 32px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
    }

    .avatar-ring {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-card);
    }

    .name {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    .profile-body {
      margin-bottom: 28px;
    }

    .bio {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 380px;
      margin: 0 auto;
    }

    .social-list {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f1f5f9;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.25s ease;
      pointer-events: auto;
    }

    .social-link:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 400px) {
      .profile-card {
        padding: 32px 24px 24px;
      }
      .name {
        font-size: 1.5rem;
      }
      .bio {
        font-size: 0.95rem;
      }
    }
  </style>
<base target="_blank">
</head>
